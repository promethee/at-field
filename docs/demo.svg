<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 393" width="740" height="393" role="img" aria-labelledby="t d">
<title id="t">at-field terminal replay</title>
<desc id="d">Two real runs of at-field on the Gettysburg Address for the theme religion. The first uses a wordlist and finds 5 of 12 words, 42 percent. The second lets the model propose 25 words and finds 1, 4 percent. The model wait and the report path are trimmed.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:13px;white-space:pre}
.cover{transform:translateX(2000px)}
@keyframes v0{0%,2.000%{opacity:0}2.250%,95.000%{opacity:1}98.000%,100%{opacity:0}}@keyframes c0{0%,2.000%{transform:translateX(0);animation-timing-function:steps(89,end)}15.000%,100%{transform:translateX(698.2px)}}@keyframes v1{0%,16.500%{opacity:0}16.750%,95.000%{opacity:1}98.000%,100%{opacity:0}}@keyframes v2{0%,17.750%{opacity:0}18.000%,95.000%{opacity:1}98.000%,100%{opacity:0}}@keyframes v3{0%,19.000%{opacity:0}19.250%,95.000%{opacity:1}98.000%,100%{opacity:0}}@keyframes v4{0%,20.250%{opacity:0}20.500%,95.000%{opacity:1}98.000%,100%{opacity:0}}@keyframes v5{0%,21.500%{opacity:0}21.750%,95.000%{opacity:1}98.000%,100%{opacity:0}}@keyframes v6{0%,22.750%{opacity:0}23.000%,95.000%{opacity:1}98.000%,100%{opacity:0}}@keyframes v7{0%,24.000%{opacity:0}24.250%,95.000%{opacity:1}98.000%,100%{opacity:0}}@keyframes v8{0%,25.250%{opacity:0}25.500%,95.000%{opacity:1}98.000%,100%{opacity:0}}@keyframes v10{0%,39.500%{opacity:0}39.750%,95.000%{opacity:1}98.000%,100%{opacity:0}}@keyframes c10{0%,39.500%{transform:translateX(0);animation-timing-function:steps(53,end)}48.500%,100%{transform:translateX(417.4px)}}@keyframes v11{0%,50.000%{opacity:0}50.250%,95.000%{opacity:1}98.000%,100%{opacity:0}}@keyframes v12{0%,53.000%{opacity:0}53.250%,95.000%{opacity:1}98.000%,100%{opacity:0}}@keyframes v13{0%,61.000%{opacity:0}61.250%,95.000%{opacity:1}98.000%,100%{opacity:0}}@keyframes v14{0%,62.500%{opacity:0}62.750%,95.000%{opacity:1}98.000%,100%{opacity:0}}@keyframes v15{0%,64.000%{opacity:0}64.250%,95.000%{opacity:1}98.000%,100%{opacity:0}}@keyframes v16{0%,65.500%{opacity:0}65.750%,95.000%{opacity:1}98.000%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.ln{animation:none!important}.cover{display:none}}
</style>
<rect width="740" height="393" rx="10" fill="#14191b"/>
<text class="ln" x="20" y="33" textLength="694.2" lengthAdjust="spacing" style="animation:v0 20s linear infinite"><tspan fill="#7f908a">$ </tspan><tspan fill="#d5dfdb">at-field examples/gettysburg.txt --theme "religion" --lexic examples/religion-words.txt</tspan></text>
<rect class="cover" x="19" y="18" width="697.2" height="21" fill="#14191b" style="animation:c0 20s linear infinite"/>
<text class="ln" x="20" y="54" textLength="319.8" lengthAdjust="spacing" style="animation:v1 20s linear infinite"><tspan fill="#7f908a">Notes: plain-text input has no timestamps</tspan></text>
<text class="ln" x="20" y="75" textLength="655.2" lengthAdjust="spacing" style="animation:v2 20s linear infinite"><tspan fill="#d5dfdb">Saturation [</tspan><tspan fill="#5fd0b8">████████</tspan><tspan fill="#7f908a">░░░░░░░░░░░░</tspan><tspan fill="#d5dfdb">] 42% (5/12 terms, between the boundaries (10%–70%))</tspan></text>
<text class="ln" x="20" y="96" textLength="0.0" lengthAdjust="spacing" style="animation:v3 20s linear infinite"></text>
<text class="ln" x="20" y="117" textLength="335.4" lengthAdjust="spacing" style="animation:v4 20s linear infinite"><tspan fill="#d5dfdb">devotion   </tspan><tspan fill="#5fd0b8">██████████████████████████████</tspan><tspan fill="#7f908a"> 2</tspan></text>
<text class="ln" x="20" y="138" textLength="335.4" lengthAdjust="spacing" style="animation:v5 20s linear infinite"><tspan fill="#d5dfdb">dedicate   </tspan><tspan fill="#5fd0b8">██████████████████████████████</tspan><tspan fill="#7f908a"> 2</tspan></text>
<text class="ln" x="20" y="159" textLength="218.4" lengthAdjust="spacing" style="animation:v6 20s linear infinite"><tspan fill="#d5dfdb">god        </tspan><tspan fill="#5fd0b8">███████████████</tspan><tspan fill="#7f908a"> 1</tspan></text>
<text class="ln" x="20" y="180" textLength="218.4" lengthAdjust="spacing" style="animation:v7 20s linear infinite"><tspan fill="#d5dfdb">consecrate </tspan><tspan fill="#5fd0b8">███████████████</tspan><tspan fill="#7f908a"> 1</tspan></text>
<text class="ln" x="20" y="201" textLength="218.4" lengthAdjust="spacing" style="animation:v8 20s linear infinite"><tspan fill="#d5dfdb">hallow     </tspan><tspan fill="#5fd0b8">███████████████</tspan><tspan fill="#7f908a"> 1</tspan></text>
<text class="ln" x="20" y="243" textLength="413.4" lengthAdjust="spacing" style="animation:v10 20s linear infinite"><tspan fill="#7f908a">$ </tspan><tspan fill="#d5dfdb">at-field examples/gettysburg.txt --theme "religion"</tspan></text>
<rect class="cover" x="19" y="228" width="416.4" height="21" fill="#14191b" style="animation:c10 20s linear infinite"/>
<text class="ln" x="20" y="264" textLength="507.0" lengthAdjust="spacing" style="animation:v11 20s linear infinite"><tspan fill="#d5dfdb">Expanding theme "religion" into a lexical field (language: en)...</tspan></text>
<text class="ln" x="20" y="285" textLength="171.6" lengthAdjust="spacing" style="animation:v12 20s linear infinite"><tspan fill="#7f908a">(model wait shortened)</tspan></text>
<text class="ln" x="20" y="306" textLength="319.8" lengthAdjust="spacing" style="animation:v13 20s linear infinite"><tspan fill="#7f908a">Notes: plain-text input has no timestamps</tspan></text>
<text class="ln" x="20" y="327" textLength="616.2" lengthAdjust="spacing" style="animation:v14 20s linear infinite"><tspan fill="#d5dfdb">Saturation [</tspan><tspan fill="#5fd0b8">█</tspan><tspan fill="#7f908a">░░░░░░░░░░░░░░░░░░░</tspan><tspan fill="#d5dfdb">] 4% (1/25 terms, below the low boundary (10%))</tspan></text>
<text class="ln" x="20" y="348" textLength="0.0" lengthAdjust="spacing" style="animation:v15 20s linear infinite"></text>
<text class="ln" x="20" y="369" textLength="280.8" lengthAdjust="spacing" style="animation:v16 20s linear infinite"><tspan fill="#d5dfdb">god </tspan><tspan fill="#5fd0b8">██████████████████████████████</tspan><tspan fill="#7f908a"> 1</tspan></text>
</svg>

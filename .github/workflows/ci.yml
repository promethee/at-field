name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Pinned rather than ubuntu-latest, which migrates to Ubuntu 26 on
    # 2026-10-19; bump deliberately.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # Node 20 reached end-of-life on 2026-04-30.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run check:pack
